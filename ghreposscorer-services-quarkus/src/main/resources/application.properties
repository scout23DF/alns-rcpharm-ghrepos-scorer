quarkus.http.port=8081
quarkus.http.test-port=0

# GitHub REST Client configuration
quarkus.rest-client."github-api".url=https://api.github.com

# Cache configuration (default Caffeine, configurable via QUARKUS_CACHE_TYPE)
quarkus.cache.type=${QUARKUS_CACHE_TYPE:caffeine}
quarkus.cache.caffeine."github-repositories".expire-after-write=10m
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}
quarkus.cache.redis.prefix=github-repositories

# OpenAPI and Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
