server.port=8080
spring.application.name=ghreposscorer-services-springboot

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=50000,expireAfterWrite=10m

# GitHub API Configuration
github.api.url=https://api.github.com

# Resilience4j CircuitBreaker Configuration
resilience4j.circuitbreaker.instances.githubApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.githubApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.githubApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.githubApi.waitDurationInOpenState=10000ms

# Resilience4j RateLimiter Configuration
resilience4j.ratelimiter.instances.githubApi.limitForPeriod=10
resilience4j.ratelimiter.instances.githubApi.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.githubApi.timeoutDuration=500ms

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
