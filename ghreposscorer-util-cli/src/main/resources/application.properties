# Disable Quarkus Startup Banner for CLI utility
quarkus.banner.enabled=false

# Disable background Quarkus Scheduler during CLI execution
quarkus.scheduler.enabled=false

# Custom output executable name
quarkus.package.output-name=ghreposscorer-util-cli

# Cache configuration (default Caffeine, configurable via QUARKUS_CACHE_TYPE)
quarkus.cache.type=redis
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}
quarkus.cache.redis.prefix=github-repositories
quarkus.cache.redis.github-repositories.value-type=java.util.List

# Global Jackson Configuration
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false

# Use random free HTTP port for CLI utility
quarkus.http.port=0
