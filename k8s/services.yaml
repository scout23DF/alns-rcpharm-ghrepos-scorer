apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: alns-rcpharm-ghrepos-scorer
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: spring-service
  namespace: alns-rcpharm-ghrepos-scorer
spec:
  type: ClusterIP
  selector:
    app: spring-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http

---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-service
  namespace: alns-rcpharm-ghrepos-scorer
spec:
  type: ClusterIP
  selector:
    app: quarkus-service
  ports:
    - port: 8081
      targetPort: 8081
      name: http
