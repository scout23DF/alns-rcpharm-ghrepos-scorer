apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-deployment
  namespace: alns-rcpharm-ghrepos-scorer
  labels:
    app: quarkus-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quarkus-service
  template:
    metadata:
      labels:
        app: quarkus-service
    spec:
      containers:
        - name: ghreposscorer-quarkus
          image: ghreposscorer-quarkus:1.0.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: ghreposscorer-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
