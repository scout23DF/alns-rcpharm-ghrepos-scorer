version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: redis-commander
    hostname: redis-commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis-cache:6379
    ports:
      - "8085:8081"
    user: redis

  ghreposscorer-springboot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghreposscorer-springboot
    ports:
      - "8080:8080"
    environment:
      - SPRING_CACHE_TYPE=redis
      - SPRING_REDIS_HOST=redis-cache
      - SPRING_REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  ghreposscorer-quarkus:
    build:
      context: .
      dockerfile: Dockerfile.quarkus
    container_name: ghreposscorer-quarkus
    ports:
      - "8081:8081"
    environment:
      - QUARKUS_CACHE_TYPE=redis
      - QUARKUS_REDIS_HOSTS=redis://redis-cache:6379
      - QUARKUS_HTTP_PORT=8081
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
